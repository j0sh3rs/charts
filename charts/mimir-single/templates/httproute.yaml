{{- if .Values.gateway.enabled -}}
{{- if not (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1") -}}
{{- fail "ERROR: Gateway API CRDs not found. Please install Gateway API CRDs before enabling gateway. Run: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.0.0/standard-install.yaml" -}}
{{- end -}}
{{- if .Values.ingress.enabled -}}
{{- fail "Cannot enable both ingress and gateway. Please disable one of them." -}}
{{- end -}}
{{- $root := . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mimir-single.fullname" . }}
  labels:
    {{- include "mimir-single.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range .Values.gateway.parentRefs }}
    - name: {{ .name | required "gateway.parentRefs[].name is required" }}
      {{- if .namespace }}
      namespace: {{ .namespace }}
      {{- end }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  {{- if .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml .Values.gateway.hostnames | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.gateway.rules }}
    - matches:
        {{- toYaml .matches | nindent 8 }}
      backendRefs:
        {{- range .backendRefs }}
        - name: {{ .name | default (include "mimir-single.fullname" $root) }}
          port: {{ .port }}
        {{- end }}
    {{- end }}
{{- end }}
