{{- if .Values.ingress.enabled -}}
{{/*
DEPRECATION WARNING: Ingress support is deprecated and will be removed in v2.0.0

Gateway API is the future of Kubernetes ingress networking. Please migrate to HTTPRoute.
Migration guide: https://github.com/grafana/mimir-single-helm/blob/main/docs/migration/ingress-to-httproute.md

To migrate:
  1. Install Gateway API CRDs: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.0.0/standard-install.yaml
  2. Create a Gateway resource in your cluster
  3. Update your values:
       ingress.enabled: false
       gateway.enabled: true
       gateway.parentRefs:
         - name: your-gateway-name

For more information:
  - Gateway API: https://gateway-api.sigs.k8s.io/
  - Migration guide: docs/migration/ingress-to-httproute.md
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mimir-single.fullname" . }}
  labels:
    {{- include "mimir-single.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ include "mimir-single.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
