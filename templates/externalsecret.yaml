{{- if .Values.externalSecrets.enabled -}}
{{- if not (.Capabilities.APIVersions.Has "external-secrets.io/v1beta1") -}}
{{- fail "ERROR: External Secrets Operator CRDs not found. Please install External Secrets Operator before enabling externalSecrets. For installation instructions: https://external-secrets.io/latest/introduction/getting-started/" -}}
{{- end -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.target.name | default (printf "%s-external-secrets" (include "mimir-single.fullname" .)) }}
  labels:
    {{- include "mimir-single.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name | required "externalSecrets.secretStore.name is required when externalSecrets.enabled=true" }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  target:
    name: {{ .Values.externalSecrets.target.name | default (printf "%s-external-secrets" (include "mimir-single.fullname" .)) }}
    creationPolicy: {{ .Values.externalSecrets.target.creationPolicy }}
    deletionPolicy: {{ .Values.externalSecrets.target.deletionPolicy }}
  data:
    {{- toYaml .Values.externalSecrets.data | nindent 4 }}
{{- end }}
