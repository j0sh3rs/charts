# NetworkPolicy Examples
# Various NetworkPolicy configurations for different use cases

# This file contains multiple example configurations.
# Choose the one that matches your requirements and adapt it to your environment.

---
# Example 1: Default Deny All
# Blocks all ingress and egress traffic
# Use as starting point and add specific allow rules

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress: []  # Empty = deny all ingress
  egress: []   # Empty = deny all egress

---
# Example 2: Allow Grafana Access Only
# Allows ingress only from Grafana pods
# Allows egress only for DNS and object storage

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
      ports:
      - protocol: TCP
        port: 9009

  egress:
    # DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
      ports:
      - protocol: UDP
        port: 53

    # Object storage (HTTPS)
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 443

---
# Example 3: Multi-Source Ingress
# Allows access from multiple applications
# Useful for monitoring setup (Grafana + Prometheus + Alertmanager)

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow Grafana
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
      ports:
      - protocol: TCP
        port: 9009

    # Allow Prometheus
    - from:
      - podSelector:
          matchLabels:
            app: prometheus
      ports:
      - protocol: TCP
        port: 9009

    # Allow Alertmanager
    - from:
      - podSelector:
          matchLabels:
            app: alertmanager
      ports:
      - protocol: TCP
        port: 9009

  egress:
    # DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
      ports:
      - protocol: UDP
        port: 53

    # Object storage
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 443

---
# Example 4: Namespace-Based Access
# Allows all pods from monitoring namespace
# Simpler alternative to pod selector approach

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow entire monitoring namespace
    - from:
      - namespaceSelector:
          matchLabels:
            name: monitoring
      ports:
      - protocol: TCP
        port: 9009

  egress:
    # DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
      ports:
      - protocol: UDP
        port: 53

    # Any HTTPS
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 443

---
# Example 5: Database Backend
# Allows egress to PostgreSQL/MySQL database
# Plus standard DNS and object storage

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
      ports:
      - protocol: TCP
        port: 9009

  egress:
    # DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
      ports:
      - protocol: UDP
        port: 53

    # PostgreSQL
    - to:
      - podSelector:
          matchLabels:
            app: postgresql
      ports:
      - protocol: TCP
        port: 5432

    # MySQL (alternative)
    # - to:
    #   - podSelector:
    #       matchLabels:
    #         app: mysql
    #   ports:
    #   - protocol: TCP
    #     port: 3306

    # Object storage
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 443

---
# Example 6: Kubernetes API Access
# Allows egress to Kubernetes API server
# Required if application uses Kubernetes client libraries

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
      ports:
      - protocol: TCP
        port: 9009

  egress:
    # DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
      ports:
      - protocol: UDP
        port: 53

    # Kubernetes API
    - to:
      - namespaceSelector: {}
      - podSelector:
          matchLabels:
            component: apiserver
      ports:
      - protocol: TCP
        port: 443

    # Object storage
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 443

---
# Example 7: Service Mesh (Istio/Linkerd)
# Relaxed rules when using service mesh
# Service mesh handles mTLS and traffic policies

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow from same namespace (service mesh handles authorization)
    - from:
      - podSelector: {}
      ports:
      - protocol: TCP
        port: 9009

  egress:
    # DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
      ports:
      - protocol: UDP
        port: 53

    # Allow all HTTPS (service mesh handles encryption)
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 443

---
# Example 8: IP Block Restrictions
# Restricts egress to specific IP ranges
# Useful for on-premises integration

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
      ports:
      - protocol: TCP
        port: 9009

  egress:
    # DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
      ports:
      - protocol: UDP
        port: 53

    # Specific object storage IP range
    - to:
      - ipBlock:
          cidr: 10.100.0.0/16  # Your object storage subnet
      ports:
      - protocol: TCP
        port: 443

    # Exclude cluster IPs
    - to:
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
            - 169.254.0.0/16  # Link-local
            - 127.0.0.0/8     # Loopback
      ports:
      - protocol: TCP
        port: 443

---
# Example 9: Development Environment
# Relaxed rules for development
# Allows broader access for debugging

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow from entire namespace
    - from:
      - podSelector: {}
      ports:
      - protocol: TCP
        port: 9009

  egress:
    # Allow all egress (for development only!)
    - to:
      - namespaceSelector: {}
    - to:
      - ipBlock:
          cidr: 0.0.0.0/0

---
# Example 10: Production Multi-Tier
# Complete production setup with all dependencies
# Includes monitoring, storage, and external services

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Grafana
    - from:
      - namespaceSelector:
          matchLabels:
            name: monitoring
        podSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
      ports:
      - protocol: TCP
        port: 9009

    # Prometheus
    - from:
      - namespaceSelector:
          matchLabels:
            name: monitoring
        podSelector:
          matchLabels:
            app: prometheus
      ports:
      - protocol: TCP
        port: 9009

    # Alertmanager
    - from:
      - namespaceSelector:
          matchLabels:
            name: monitoring
        podSelector:
          matchLabels:
            app: alertmanager
      ports:
      - protocol: TCP
        port: 9009

    # Gateway/Ingress Controller
    - from:
      - namespaceSelector:
          matchLabels:
            name: gateway-system
        podSelector:
          matchLabels:
            app.kubernetes.io/name: gateway
      ports:
      - protocol: TCP
        port: 9009

  egress:
    # DNS - CoreDNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53

    # Object Storage (S3/GCS/Azure)
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 443

    # PostgreSQL (if used)
    - to:
      - namespaceSelector:
          matchLabels:
            name: database
        podSelector:
          matchLabels:
            app: postgresql
      ports:
      - protocol: TCP
        port: 5432

    # Redis (if used for caching)
    - to:
      - namespaceSelector:
          matchLabels:
            name: cache
        podSelector:
          matchLabels:
            app: redis
      ports:
      - protocol: TCP
        port: 6379

---
# Testing NetworkPolicy

# After applying NetworkPolicy, test connectivity:

# 1. Test allowed ingress:
#    kubectl run -it --rm test --image=nicolaka/netshoot -n monitoring \
#      --labels="app.kubernetes.io/name=grafana" -- \
#      curl http://mimir-single.mimir:9009/ready

# 2. Test denied ingress:
#    kubectl run -it --rm test --image=nicolaka/netshoot -n default -- \
#      curl --max-time 5 http://mimir-single.mimir:9009/ready
#    # Should timeout or be refused

# 3. Test DNS egress from within pod:
#    kubectl exec -n mimir mimir-single-0 -- nslookup kubernetes.default

# 4. Test object storage egress:
#    kubectl exec -n mimir mimir-single-0 -- \
#      wget --spider https://storage.googleapis.com

# 5. Verify NetworkPolicy is applied:
#    kubectl get networkpolicy -n mimir
#    kubectl describe networkpolicy mimir-single -n mimir

# 6. Debug connectivity issues:
#    kubectl logs -n mimir mimir-single-0
#    # Look for connection errors or timeouts

---
# Troubleshooting Tips

# If connectivity fails after applying NetworkPolicy:

# 1. Check pod labels match selectors:
#    kubectl get pods -n monitoring --show-labels
#    kubectl get pods -n mimir --show-labels

# 2. Check namespace labels:
#    kubectl get namespace monitoring --show-labels
#    kubectl get namespace kube-system --show-labels

# 3. Verify NetworkPolicy syntax:
#    kubectl describe networkpolicy mimir-single -n mimir

# 4. Temporarily disable for debugging:
#    helm upgrade mimir-single . -n mimir \
#      --set networkPolicy.enabled=false --reuse-values

# 5. Test with broad rules first, then narrow down:
#    # Start with allow-all egress
#    egress:
#      - to:
#        - namespaceSelector: {}
#    # Then gradually restrict

# 6. Check for CNI plugin support:
#    # Not all CNI plugins support NetworkPolicy
#    # Verify your CNI (Calico, Cilium, Weave, etc.) supports NetworkPolicy

---
# Common Mistakes to Avoid

# ❌ DON'T: Use empty selector for all pods
# ingress:
#   - from:
#     - podSelector: {}  # This allows ALL pods in same namespace only

# ✅ DO: Be explicit about what you're allowing
# ingress:
#   - from:
#     - podSelector:
#         matchLabels:
#           app.kubernetes.io/name: grafana

# ❌ DON'T: Forget DNS egress
# egress: []  # This blocks DNS, breaking name resolution

# ✅ DO: Always allow DNS
# egress:
#   - to:
#     - namespaceSelector:
#         matchLabels:
#           name: kube-system
#     ports:
#     - protocol: UDP
#       port: 53

# ❌ DON'T: Mix podSelector and namespaceSelector incorrectly
# ingress:
#   - from:
#     - podSelector: {}
#       namespaceSelector: {}  # This is AND, not OR!

# ✅ DO: Use separate from entries for OR logic
# ingress:
#   - from:
#     - podSelector: {}
#     - namespaceSelector: {}  # This is OR

# ❌ DON'T: Allow all without policy types
# networkPolicy:
#   enabled: true
#   ingress: []  # Without policyTypes, this has no effect

# ✅ DO: Explicitly set policy types
# networkPolicy:
#   enabled: true
#   policyTypes:
#     - Ingress
#     - Egress
#   ingress: []

