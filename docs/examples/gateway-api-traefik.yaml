# Gateway API Configuration for Traefik
# This example demonstrates Gateway API configuration with Traefik as the Gateway controller

---
# Gateway Resource - Shared infrastructure component
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mimir-gateway
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    # HTTPS listener with TLS termination
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: mimir-tls
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: All

    # HTTP listener for redirect
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.example.com"
      allowedRoutes:
        namespaces:
          from: All

---
# ReferenceGrant - Allows HTTPRoute to reference Gateway
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-mimir-httproute
  namespace: traefik
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default  # namespace where mimir-single is deployed
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway

---
# Helm values for mimir-single chart
# Save this section to values-traefik.yaml
gateway:
  enabled: true
  parentRefs:
    - name: mimir-gateway
      namespace: traefik
      sectionName: https
  hostnames:
    - mimir.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mimir-single
          port: 8080

# NetworkPolicy for traffic control (optional)
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana

---
# HTTP to HTTPS Redirect HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mimir-http-redirect
  namespace: default  # same namespace as mimir-single
spec:
  parentRefs:
    - name: mimir-gateway
      namespace: traefik
      sectionName: http
  hostnames:
    - mimir.example.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
# Advanced: Rate Limiting with Traefik Middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mimir-rate-limit
  namespace: default
spec:
  rateLimit:
    average: 100
    burst: 200
    period: 1s

---
# HTTPRoute with Rate Limiting (Traefik-specific extension)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mimir-single-with-ratelimit
  namespace: default
  annotations:
    traefik.io/middleware: mimir-rate-limit@kubernetescrd
spec:
  parentRefs:
    - name: mimir-gateway
      namespace: traefik
      sectionName: https
  hostnames:
    - mimir.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mimir-single
          port: 8080

---
# Installation and Verification Commands
#
# 1. Install Traefik with Gateway API support:
#    helm repo add traefik https://traefik.github.io/charts
#    helm repo update
#    helm install traefik traefik/traefik \
#      --namespace traefik \
#      --create-namespace \
#      --set gateway.enabled=true \
#      --set gatewayClass.enabled=true
#
# 2. Install Gateway API CRDs:
#    kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.0.0/standard-install.yaml
#
# 3. Verify Traefik GatewayClass:
#    kubectl get gatewayclass
#    # Should show: traefik
#
# 4. Create TLS certificate secret:
#    kubectl create secret tls mimir-tls \
#      --cert=tls.crt \
#      --key=tls.key \
#      -n traefik
#
# 5. Apply Gateway and ReferenceGrant:
#    kubectl apply -f gateway-api-traefik.yaml
#
# 6. Install mimir-single Helm chart:
#    helm install mimir-single grafana/mimir-single -f values-traefik.yaml
#
# 7. Verify Gateway status:
#    kubectl get gateway mimir-gateway -n traefik
#    kubectl wait --for=condition=Programmed gateway/mimir-gateway -n traefik --timeout=5m
#
# 8. Verify HTTPRoute status:
#    kubectl get httproute mimir-single -n default
#    kubectl describe httproute mimir-single -n default
#
# 9. Get Traefik LoadBalancer IP/hostname:
#    kubectl get svc traefik -n traefik
#
# 10. Test connectivity:
#     curl -v https://mimir.example.com/
#     curl -v http://mimir.example.com/  # should redirect to HTTPS
#
# Troubleshooting:
# - Check Traefik logs: kubectl logs -n traefik -l app.kubernetes.io/name=traefik
# - Verify DNS: nslookup mimir.example.com
# - Check HTTPRoute status: kubectl get httproute mimir-single -o yaml | grep -A 20 status
# - Traefik dashboard: kubectl port-forward -n traefik svc/traefik 9000:9000
#   Access at: http://localhost:9000/dashboard/
